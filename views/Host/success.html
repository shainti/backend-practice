<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Success</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .success-box {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .success-icon {
      font-size: 50px;
      color: #28a745;
    }

    h2 {
      margin: 15px 0 10px;
      color: #333;
    }

    p {
      color: #555;
      font-size: 15px;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #28a745;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
    }

    .btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
    <div>

    </div>
  <div class="success-box">
    <div class="success-icon">✔</div>
    <h2>Success!</h2>
    <p>Your data has been submitted successfully.</p>
    <a href="/" class="btn">Go Back</a>
  </div>

</body>
</html>
